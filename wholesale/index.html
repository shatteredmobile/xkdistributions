:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.mast{padding-block:28px 18px;display:grid;grid-template-columns:1fr auto;gap:14px 24px;align-items:end}
.co{font:700 13px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font:800 clamp(30px,6vw,46px)/1.02 var(--f-display);font-stretch:82%;margin:8px 0 0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin-top:8px;max-width:56ch}
.contact{display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-size:14px}
.contact .ln{display:flex;gap:8px;align-items:center}
.contact .v{font-family:var(--f-mono);user-select:all}
.copy{font:500 12px var(--f-body);background:transparent;color:var(--accent);border:1px solid var(--line2);border-radius:6px;padding:2px 8px;cursor:pointer}
.copy:hover{border-color:var(--accent)}
.copy:focus-visible,.chip:focus-visible,#q:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:flex;gap:22px;flex-wrap:wrap;padding-block:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat b{display:block;font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:flex;flex-direction:column;gap:10px}
#q{width:100%;font:16px var(--f-body);padding:11px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:0 0 auto;font:500 13px var(--f-body);padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
section.cat{margin-top:18px}
.cat h2{font:700 15px/1 var(--f-display);font-stretch:90%;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cat h2 span{font:500 12px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.upc{font:12px var(--f-mono);color:var(--muted);margin-top:2px}
.qty{text-align:right;font:600 17px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.qty small{display:block;font:500 11px var(--f-body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.qty.low{color:var(--low)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
footer{padding-block:28px 40px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px}
@media (max-width:620px){header.mast{grid-template-columns:1fr}.contact{align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

      if(!nq) return true;
      if(norm(i.n).indexOf(nq)>=0 || norm(i.c).indexOf(nq)>=0) return true;
      return dq.length>=4 && (i.u||[]).some(function(u){return u.replace(/^0+/,'').indexOf(dq)>=0;});
    });
    var by={}; rows.forEach(function(i){(by[i.c]=by[i.c]||[]).push(i);});
    var h='';
    Object.keys(by).sort().forEach(function(c){
      var list=by[c]; var u=list.reduce(function(a,i){return a+i.q;},0);
      h+='<section class="cat"><h2>'+esc(c)+'<span>'+list.length+' product'+(list.length>1?'s':'')+' · '+u.toLocaleString()+' units</span></h2><div class="list">';
      list.forEach(function(i){
        h+='<div class="row"><div class="nm">'+esc(i.n)+((i.u&&i.u.length)?'<div class="upc">UPC '+esc(i.u[0])+'</div>':'')+'</div>'+
           '<div class="qty'+(i.q<=3?' low':'')+'">'+i.q.toLocaleString()+'<small>'+(i.q<=3?'Low stock':'In stock')+'</small></div></div>';
      });
      h+='</div></section>';
    });
    document.getElementById('out').innerHTML=h || '<div class="empty">'+(items.length?'Nothing matches your search. Try a shorter word, or pick All.':'The stock list is being refreshed. Please check back shortly.')+'</div>';
  }
  document.getElementById('chips').addEventListener('click',function(e){var b=e.target.closest('.chip'); if(!b) return; cat=b.getAttribute('data-c'); try{localStorage.setItem('xk-cat',cat);}catch(err){} chips(); render();});
  document.getElementById('q').addEventListener('input',function(e){q=e.target.value; render();});
  document.querySelectorAll('.copy').forEach(function(b){ b.addEventListener('click',function(){
    var el=document.getElementById(b.getAttribute('data-copy')); var t=el.textContent;
    var done=function(){b.textContent='Copied'; setTimeout(function(){b.textContent='Copy';},1500);};
    var fallback=function(){ var r=document.createRange(); r.selectNodeContents(el); var s=getSelection(); s.removeAllRanges(); s.addRange(r); };
    try{ navigator.clipboard.writeText(t).then(done,fallback); }catch(err){ fallback(); }
  });});
  chips(); render();
})();
</script>
</body>
</html>
